<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>癖の小窝</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%238aa0c0' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%238aa0c0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;overflow-x:hidden}
  html,body{background:#0a0c10;color:#e8ecf2;font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  body{
    background:
      radial-gradient(600px 400px at 20% -10%, rgba(90,110,150,.22), transparent 60%),
      radial-gradient(500px 500px at 110% 30%, rgba(70,80,120,.16), transparent 60%),
      radial-gradient(400px 400px at 50% 110%, rgba(60,70,100,.18), transparent 60%),
      #0a0c10;
    padding:24px 16px 120px;
  }
  .phone{max-width:430px;margin:0 auto;position:relative}

  .top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:10px 4px;margin-bottom:40px;background:linear-gradient(180deg,#0a0c10 70%,transparent);backdrop-filter:blur(8px)}
  .top .l{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.15em;color:rgba(232,236,242,.55)}
  .top .dot{width:6px;height:6px;border-radius:50%;background:#8aa0c0;box-shadow:0 0 10px #8aa0c0}
  /* 游客模式：隐藏所有编辑按钮 */
  body.guest .add-btn,
  body.guest .invite-edit,
  body.guest .edit-btn,
  body.guest .icon-btn.del,
  body.guest .icon-btn.fav,
  body.guest .icon-btn.enter-btn{display:none !important}
  body.guest .stamp-txt{pointer-events:none}
  /* 密码入口小按钮 */
  .pwd-entry{
    position:fixed;bottom:12px;right:12px;z-index:200;
    width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    color:rgba(232,236,242,.3);font-size:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .pwd-entry:active{transform:scale(.95)}

  .add-btn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#c8d4e6,#8aa0c0);color:#0e1118;border:none;font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(138,160,192,.3);transition:transform .15s}
  .add-btn:active{transform:scale(.95)}
  .add-btn svg{width:12px;height:12px;fill:currentColor}

  .reveal{opacity:0;transform:translateY(48px);transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .reveal.visible{opacity:1;transform:translateY(0)}
  @media (prefers-reduced-motion: reduce){
    .reveal{opacity:1;transform:none;transition:none}
    .meteor{display:none}
  }

  .hero{margin-bottom:140px}
  .glass{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 20px 50px rgba(0,0,0,.45);
    position:relative;overflow:hidden;
  }
  .cover-card{padding:14px}
  .cover{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#1a1d25;cursor:pointer}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .55s ease, transform 8s ease}
  .cover.fading img{opacity:0}
  .cover .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%);pointer-events:none}
  .cover .gloss{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 40%);pointer-events:none}
  .cover-index{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .cover.placeholder{display:flex;align-items:center;justify-content:center;color:rgba(232,236,242,.3);font-size:13px;letter-spacing:.1em}

  .info{padding:36px 8px 6px}
  .tag{display:inline-block;font-size:10px;letter-spacing:.2em;color:#a8b8d4;background:rgba(138,160,192,.14);border:1px solid rgba(138,160,192,.25);padding:4px 11px;border-radius:20px;margin-bottom:18px}
  .song-title{font-family:"Noto Serif SC",serif;font-size:34px;font-weight:600;line-height:1.3;color:#f2f5fa;letter-spacing:.02em;transition:opacity .3s ease}
  .song-artist{margin-top:12px;font-size:13px;color:rgba(232,236,242,.55)}
  .song-artist b{color:rgba(232,236,242,.9);font-weight:500;margin-right:6px}
  .song-desc{margin-top:20px;font-size:14.5px;line-height:2.1;color:rgba(232,236,242,.65);font-weight:300;transition:opacity .3s ease}
  .info.swapping .song-title,.info.swapping .song-artist,.info.swapping .song-desc{opacity:0}

  .actions{display:flex;gap:10px;margin-top:32px;align-items:center;flex-wrap:wrap}
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);backdrop-filter:blur(14px);color:#e8ecf2;font-size:13px;font-weight:500;padding:11px 18px;border-radius:24px;cursor:pointer;transition:all .2s ease;font-family:inherit}
  .btn:active{transform:scale(.96)}
  .btn svg{width:13px;height:13px;fill:currentColor}
  .btn-primary{background:linear-gradient(135deg,#c8d4e6,#8aa0c0);color:#0e1118;border:none;box-shadow:0 8px 20px rgba(138,160,192,.3);padding:12px 22px}

  .eclipse-section{margin:160px 0;display:flex;flex-direction:column;align-items:center;gap:24px}
  .eclipse{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;border-radius:50%}
  .moon{
    width:180px;height:180px;border-radius:50%;
    background:
      radial-gradient(circle at 32% 30%, rgba(255,255,255,.4) 0%, transparent 40%),
      radial-gradient(circle at 68% 72%, rgba(0,0,0,.12) 0%, transparent 30%),
      radial-gradient(circle at 50% 50%, #f0ebd8 0%, #cfc9b4 55%, #9a9684 100%);
    box-shadow:0 0 60px rgba(240,235,216,.25), 0 0 120px rgba(240,235,216,.1);
    position:relative;z-index:1;
  }
  .blood{position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 50% 50%, #a84838 0%, #6a2820 60%, #3a1410 100%);box-shadow:0 0 80px rgba(168,72,56,.4);opacity:0;z-index:2;animation:bloodFade 16s ease-in-out infinite;pointer-events:none}
  .shadow{position:absolute;width:200px;height:200px;border-radius:50%;background:#05070a;box-shadow:inset 0 0 40px rgba(0,0,0,.8);animation:eclipseMove 16s ease-in-out infinite;z-index:3;pointer-events:none}
  .eclipse.paused .shadow,.eclipse.paused .blood{animation-play-state:paused}
  @keyframes eclipseMove{0%{transform:translateX(-200px)}42%{transform:translateX(0)}58%{transform:translateX(0)}100%{transform:translateX(200px)}}
  @keyframes bloodFade{0%,38%,62%,100%{opacity:0}46%,54%{opacity:.9}}
  .eclipse-label{font-size:11px;letter-spacing:.3em;color:rgba(232,236,242,.4);text-align:center;line-height:2}
  .eclipse-label b{color:#a8b8d4;font-weight:500}

  .section-label{text-align:center;margin:0 0 100px;font-size:11px;letter-spacing:.4em;color:rgba(232,236,242,.35)}
  .section-label::before,.section-label::after{content:"";display:inline-block;width:30px;height:1px;background:rgba(232,236,242,.2);vertical-align:middle;margin:0 14px}

  .track-card{
    position:relative;overflow:hidden;
    margin-bottom:140px;padding:0;
    border-radius:24px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(16px);
    cursor:pointer;transition:all .3s ease;
  }
  .track-card:active{transform:scale(.985)}
  .track-card.active{border-color:rgba(138,160,192,.35)}

  .t-cover{
    width:100%;aspect-ratio:4/3;overflow:hidden;position:relative;
    background:#1a1d25;
  }
  .t-cover img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
  .track-card:active .t-cover img{transform:scale(1.04)}
  .t-cover-num{
    position:absolute;bottom:14px;left:18px;
    font-family:"Noto Serif SC",serif;font-size:48px;font-weight:300;
    color:rgba(255,255,255,.5);text-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  .t-body{padding:22px 24px 18px}
  .t-name{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600;color:rgba(232,236,242,.92);line-height:1.4;animation:floatText 5s ease-in-out infinite}
  .track-card.active .t-name{color:#c8d4e6}
  .t-artist{font-size:12px;color:rgba(232,236,242,.45);margin-top:8px;letter-spacing:.05em;animation:floatText 5s ease-in-out infinite .5s}
  .t-desc{font-size:13.5px;line-height:2;color:rgba(232,236,242,.55);margin-top:14px;font-weight:300;animation:floatText 6s ease-in-out infinite 1s}
  @keyframes floatText{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
  }

  .t-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:18px;border-top:1px dashed rgba(255,255,255,.08)}
  .t-status{font-size:11px;color:rgba(168,184,212,.7);letter-spacing:.15em}
  .t-actions{display:flex;gap:8px}
  .icon-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.05);border:none;color:rgba(232,236,242,.5);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:inherit}
  .icon-btn:hover{background:rgba(138,160,192,.2);color:#c8d4e6}
  .icon-btn.del:hover{background:rgba(200,100,100,.2);color:#d4a8a8}
  .icon-btn svg{width:13px;height:13px;fill:currentColor}

  .empty{text-align:center;padding:80px 20px;color:rgba(232,236,242,.4)}
  .empty .big{font-size:56px;margin-bottom:20px;opacity:.35;font-family:"Noto Serif SC",serif}
  .empty p{font-size:13px;line-height:2.2}

  .ripple{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.3) 0%,rgba(255,255,255,0) 70%);transform:scale(0);animation:ripple .65s ease-out forwards}
  @keyframes ripple{to{transform:scale(4);opacity:0}}

  .foot{text-align:center;margin-top:100px;font-size:11px;color:rgba(232,236,242,.3);line-height:2;letter-spacing:.05em}

  /* ===== 邀请函进入封面 ===== */
  .welcome{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(180deg,#e8ecf4 0%,#d8dce8 50%,#c8d0e0 100%);
    overflow:hidden;
    transition:opacity .9s ease, visibility .9s;
  }
  .welcome.leaving{opacity:0;visibility:hidden;pointer-events:none}
  .welcome-track{
    display:flex;width:200%;height:100%;
    transition:transform 1s cubic-bezier(.7,0,.2,1);
  }
  .welcome-slide{
    width:50%;height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;
  }
  .welcome-slide.slide-dark{
    background:
      radial-gradient(600px 400px at 20% -10%, rgba(90,110,150,.3), transparent 60%),
      radial-gradient(500px 500px at 110% 30%, rgba(70,80,120,.22), transparent 60%),
      radial-gradient(400px 400px at 50% 110%, rgba(60,70,100,.25), transparent 60%),
      #07090d;
  }
  .welcome-track.slide-in{transform:translateX(-50%)}

  /* 全屏雪花层 */
  .snow-full{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .snow-full span{
    position:absolute;top:-20px;border-radius:50%;
    background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);
    animation:snowFall linear infinite;
  }
  @keyframes snowFall{
    0%{transform:translateY(-20px) translateX(0);opacity:0}
    10%{opacity:.9}
    90%{opacity:.7}
    100%{transform:translateY(110vh) translateX(60px);opacity:0}
  }
  .invite{
    width:100%;max-width:340px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    padding:56px 36px 48px;
    text-align:center;
    box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 30px 80px rgba(0,0,0,.5);
    position:relative;
    animation:inviteIn 1s cubic-bezier(.2,.8,.2,1) .5s both;
  }
  .welcome.leaving .invite{animation:inviteOut .6s ease both}
  @keyframes inviteIn{
    from{opacity:0;transform:translateY(60px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes inviteOut{
    to{opacity:0;transform:translateY(-30px) scale(.94)}
  }
  .invite::before{
    content:"";position:absolute;inset:10px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;pointer-events:none;
  }
  .invite-tag{
    font-size:10px;letter-spacing:.5em;color:#a8b8d4;
    margin-bottom:28px;text-indent:.5em;
  }
  .invite-title{
    font-family:"Noto Serif SC",serif;
    font-size:30px;font-weight:600;line-height:1.5;
    color:#f2f5fa;letter-spacing:.05em;
  }
  .invite-sub{
    margin-top:24px;font-size:12px;line-height:2;
    color:rgba(232,236,242,.45);font-weight:300;letter-spacing:.1em;
  }
  .invite-btns{
    margin-top:36px;display:flex;flex-direction:column;gap:12px;
  }
  .invite-btn{
    position:relative;overflow:hidden;
    padding:14px;border-radius:26px;font-size:14px;font-family:inherit;
    cursor:pointer;transition:all .25s ease;letter-spacing:.15em;
  }
  .invite-btn:active{transform:scale(.97)}
  .invite-ghost{
    background:transparent;color:rgba(232,236,242,.7);
    border:1px solid rgba(255,255,255,.18);
  }
  .invite-ghost:hover{border-color:rgba(168,184,212,.5);color:#c8d4e6}
  .invite-primary{
    background:linear-gradient(135deg,#c8d4e6,#8aa0c0);
    color:#0e1118;border:none;font-weight:600;
    box-shadow:0 10px 28px rgba(138,160,192,.35);
  }
  .invite-primary:hover{box-shadow:0 14px 36px rgba(138,160,192,.5)}
  .invite-edit{
    position:absolute;top:16px;right:16px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    color:rgba(232,236,242,.5);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;z-index:2;
  }
  .invite-edit:hover{background:rgba(138,160,192,.2);color:#c8d4e6}
  .invite-edit svg{width:13px;height:13px;fill:currentColor}

  /* ===== 大邮票（第一屏，中间撕开） ===== */
  .big-stamp{
    position:relative;width:300px;height:170px;
    animation:stampFade .8s ease both;
  }
  .stamp-half{
    position:absolute;top:0;height:100%;
    background:linear-gradient(160deg,#ffffff,#eef2f8);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;user-select:none;-webkit-user-select:none;
    box-shadow:0 10px 30px rgba(100,120,160,.25);
    overflow:hidden;
  }
  .stamp-half.left{
    left:0;width:50%;
    border:4px dashed rgba(170,185,210,.5);
    border-right:4px dashed rgba(140,160,195,.7);
    border-radius:14px 0 0 14px;
    justify-content:center;
    transition:opacity .6s;
  }
  .stamp-half.right{
    right:0;width:50%;
    border:4px dashed rgba(170,185,210,.5);
    border-left:4px dashed rgba(140,160,195,.7);
    border-radius:0 14px 14px 0;
    justify-content:center;
    transition:transform 1.8s cubic-bezier(.5,0,.8,.4), opacity 1.8s;
    transform-origin:center left;
  }
  .big-stamp.holding .stamp-half.right{transform:rotate(2deg)}
  .big-stamp.torn .stamp-half.right{
    transform:translateX(300px) rotate(25deg);
    opacity:0;
  }
  .big-stamp.torn .stamp-half.left{opacity:.3}
  /* 雪花泡泡：可点击爆开 */
  .stamp-moon{
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #fff, #e8eef8);
    box-shadow:0 0 24px rgba(200,220,245,.7), inset -3px -3px 8px rgba(150,165,195,.15);
    position:relative;cursor:pointer;user-select:none;
    display:flex;align-items:center;justify-content:center;
    transition:transform .4s cubic-bezier(.3,1.4,.5,1);
  }
  .stamp-moon:hover{transform:scale(1.08)}
  .stamp-moon .snowflake{
    font-size:24px;color:#8aa0c0;line-height:1;
  }
  .stamp-moon.burst{animation:bubbleBurst .6s ease-out forwards}
  .stamp-moon.burst .snowflake{animation:snowflakeFlip .6s ease-out forwards}
  .stamp-moon.regrow{animation:bubbleRegrow .8s ease-out forwards}
  @keyframes bubbleBurst{
    0%{transform:scale(1)}
    40%{transform:scale(1.15)}
    100%{transform:scale(0);opacity:0}
  }
  @keyframes snowflakeFlip{
    0%{transform:rotate(0deg);opacity:1}
    100%{transform:rotate(360deg) scale(.3);opacity:0}
  }
  @keyframes bubbleRegrow{
    0%{transform:scale(0);opacity:0}
    60%{transform:scale(1.1)}
    100%{transform:scale(1);opacity:1}
  }
  .stamp-half .stamp-txt{
    font-size:13px;letter-spacing:.25em;color:#6a7a9a;
    text-align:center;padding:0 16px;line-height:1.6;
    max-width:100%;overflow:hidden;word-break:break-all;
  }
  /* 邮票上的忧郁小图案 */
  .stamp-deco{
    position:absolute;font-size:10px;color:#b8c4d8;opacity:.5;
    pointer-events:none;
  }
  /* 撕开时的雪花粒子 */
  .tear-snow{
    position:absolute;left:50%;top:50%;
    width:6px;height:6px;border-radius:50%;
    background:#fff;pointer-events:none;
    box-shadow:0 0 6px #c8d4e6;
    animation:tearSnow 1.5s ease-out forwards;
  }
  @keyframes tearSnow{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx), var(--dy)) scale(.3);opacity:0}
  }
  .stamp-tear-line{
    position:absolute;top:0;left:50%;width:2px;height:100%;
    background:repeating-linear-gradient(to bottom, rgba(120,110,90,.6) 0 6px, transparent 6px 12px);
    transform:translateX(-50%);pointer-events:none;
  }
  @keyframes stampFade{
    from{opacity:0}
    to{opacity:1}
  }
  .stamp-hint{
    position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);
    font-size:11px;color:rgba(232,236,242,.4);letter-spacing:.2em;
    animation:hintBlink 2s ease-in-out infinite;
    white-space:nowrap;
  }
  @keyframes hintBlink{
    0%,100%{opacity:.3}
    50%{opacity:.7}
  }
  .enter-invite{
    position:absolute;bottom:60px;left:50%;transform:translateX(-50%) translateY(10px);
    padding:14px 36px;border-radius:26px;
    background:linear-gradient(135deg,#c8d4e6,#8aa0c0);
    color:#0e1118;border:none;font-size:14px;font-family:inherit;font-weight:600;
    letter-spacing:.2em;cursor:pointer;white-space:nowrap;
    opacity:0;pointer-events:none;
    transition:opacity .6s, transform .6s;
    box-shadow:0 10px 28px rgba(138,160,192,.35);
    z-index:5;
  }
  .enter-invite.show{
    opacity:1;transform:translateX(-50%) translateY(0);
    pointer-events:auto;
  }

  /* ===== 雪花 ===== */
  .snow-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:1}
  @keyframes snowFall{
    0%{transform:translateY(-10px) translateX(0);opacity:0}
    10%{opacity:.8}
    90%{opacity:.6}
    100%{transform:translateY(110vh) translateX(40px);opacity:0}
  }
  .invite-meteor{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#fff;box-shadow:0 0 6px #fff;opacity:0;
    animation:inviteMeteor 4s linear infinite;
  }
  .invite-meteor::after{
    content:"";position:absolute;right:0;top:50%;
    width:60px;height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.7));
    transform:translateY(-50%);
  }
  .invite-meteor.m1{top:15%;left:85%}
  .invite-meteor.m2{top:60%;left:70%;animation-delay:2s}
  @keyframes inviteMeteor{
    0%{transform:translate(0,0) rotate(-35deg);opacity:0}

const STORAGE_KEY = 'my_photo_journal_v2';
const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%231a1d25'/><text x='100' y='115' font-size='70' text-anchor='middle' fill='%233a4050'>✦</text></svg>`);

let ITEMS = [];
let current = -1;
let editingIdx = -1;

const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
function observeReveal(el){ io.observe(el); }

const POOL1 = 'https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/H6mob4fb3o5NH2xT3QNckqlvnTe';
const POOL2 = 'https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/U61ebB66jo7kKbxUWWFcJlyVnWh';
const POOL3 = 'https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/XJV4bIqF8oyEfnxvI49czAoxnid';
const POOL4 = 'https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/ArvjbJrCXoTLVqxSfboc8e4qnVf';

];
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw === null) ITEMS = DEMO_ITEMS.slice();
    else ITEMS = JSON.parse(raw) || [];
  }catch(e){ ITEMS = []; }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(ITEMS)); }
function escapeHtml(t){ return String(t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderList(){
  trackList.innerHTML = '';
  emptyState.style.display = ITEMS.length ? 'none' : 'block';
  observeReveal(emptyState);

  ITEMS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'track-card reveal' + (i === current ? ' active' : '');
    card.innerHTML = `
      <span class="meteor m1"></span>
      <span class="meteor m2"></span>
      <span class="meteor m3"></span>
      <div class="t-cover">
        <img src="${(s.imgs&&s.imgs[0]) || s.img || PLACEHOLDER_IMG}" alt="" onerror="this.src='${PLACEHOLDER_IMG}'">
        <div class="t-cover-num">${String(i+1).padStart(2,'0')}</div>

      <div class="t-body">
        <div class="t-name">${escapeHtml(s.title)}</div>
        <div class="t-artist">${escapeHtml(s.artist || '')}</div>
        ${s.desc ? `<div class="t-desc">${escapeHtml(s.desc)}</div>` : ''}
      </div>
      <div class="t-foot">
        <div class="t-status">第 ${i+1} 段</div>

            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </button>
          <button class="icon-btn enter-btn" title="进入">
            <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
          </button>
          <button class="icon-btn edit-btn" title="编辑">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75l1.83-1.83z"/></svg>
          </button>
          <button class="icon-btn del" title="删除">×</button>
        </div>
      </div>`;

    card.addEventListener('click', (e) => {
      if(e.target.closest('.icon-btn')) return;
      rippleAt(card, e);
      askEnter(i);
    });
    card.querySelector('.enter-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openDetail(i);
    });
    card.querySelector('.fav').addEventListener('click', (e) => {
      e.stopPropagation();
      s.fav = !s.fav; save(); renderList();
    });
    card.querySelector('.edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openSheet(i);
    });
    card.querySelector('.del').addEventListener('click', (e) => {
      e.stopPropagation();
      ITEMS.splice(i, 1); save();
      if(current === i){ current = -1; resetView(); }
      renderList();
    });
    trackList.appendChild(card);
    observeReveal(card);
  });
}

function selectItem(i){

  coverImg.style.display = 'block';
  cover.querySelector('.shade').style.display = 'block';
  cover.querySelector('.gloss').style.display = 'block';
  coverIndex.style.display = 'block';
  cover.classList.remove('placeholder');
  info.classList.add('swapping');
  setTimeout(() => {
    songTitle.textContent  = s.title;
    songArtist.textContent = s.artist || '';
    songDesc.textContent    = s.desc || '（还没有写描述）';
    info.classList.remove('swapping');
  }, 280);
  cover.classList.add('fading');
  setTimeout(() => {
    coverImg.src = s.img || PLACEHOLDER_IMG;
    coverImg.style.transform = 'scale(1.08)';
    coverIndex.textContent = String(i+1).padStart(2,'0') + ' / ' + String(ITEMS.length).padStart(2,'0');
    cover.classList.remove('fading');
    setTimeout(() => { coverImg.style.transform = 'scale(1)'; }, 60);
  }, 480);
  renderList();
}

function resetView(){
  $('coverPlaceholder').style.display = 'block';
  coverImg.style.display = 'none';
  cover.querySelector('.shade').style.display = 'none';
  cover.querySelector('.gloss').style.display = 'none';
  coverIndex.style.display = 'none';
  cover.classList.add('placeholder');
  songTitle.textContent = '空册';
  songArtist.textContent = '—';
  songDesc.textContent = '点右上角「+」添加你的第一段文字和图片。';
  nextBtn.disabled = true;
}

/* ===== 进入确认小邀请函 ===== */
let pendingIdx = -1;
function askEnter(i){
  pendingIdx = i;
  document.getElementById('confirmTitle').textContent = '想要进入「' + ITEMS[i].title + '」吗？';
  document.getElementById('confirmSub').textContent = '点「进入」滑到完整画面';
  document.getElementById('confirm').classList.add('show');
}
document.getElementById('confirmYes').addEventListener('click', () => {
  document.getElementById('confirm').classList.remove('show');
  if(pendingIdx >= 0) openDetail(pendingIdx);
  pendingIdx = -1;
});
document.getElementById('confirmNo').addEventListener('click', () => {
  document.getElementById('confirm').classList.remove('show');
  pendingIdx = -1;
});

let currentDetailIdx = -1;
let detailImgIdx = 0;

function getImgs(s){
  if(s.imgs && s.imgs.length) return s.imgs;
  return [s.img || PLACEHOLDER_IMG];
}

function openDetail(i){
  const s = ITEMS[i];
  currentDetailIdx = i;
  detailImgIdx = 0;
  $('detailImg').src = getImgs(s)[0];
  $('detailTitle').textContent = s.title;
  $('detailArtist').textContent = s.artist || '';
  $('detailDesc').textContent = s.desc || '';
  ['detailImg','detailTitle','detailArtist','detailDesc'].forEach(id => {
    const el = $(id);
    el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
  });
  detail.classList.add('show');
  document.body.style.overflow = 'hidden';
}

$('shuffleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const s = ITEMS[currentDetailIdx];
  const imgs = getImgs(s);
  if(imgs.length < 2) return;
  detailImgIdx = (detailImgIdx + 1) % imgs.length;
  $('detailImg').style.animation = 'none';
  $('detailImg').offsetHeight;
  $('detailImg').style.animation = 'fadeUp .5s ease';
  $('detailImg').src = imgs[detailImgIdx];
});
$('detailBack').addEventListener('click', () => {
  detail.classList.remove('show');
  document.body.style.overflow = '';
});

function rippleAt(el, e){
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const cx = (e.clientX || rect.left + rect.width/2);
  const cy = (e.clientY || rect.top + rect.height/2);
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.width = r.style.height = size + 'px';
  r.style.left = (cx - rect.left - size/2) + 'px';
  r.style.top  = (cy - rect.top  - size/2) + 'px';
  el.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

function openSheet(idx){
  editingIdx = idx;
  if(idx >= 0){
    $('sheetTitle').textContent = '编辑 · ' + ITEMS[idx].title;
    $('fTitle').value = ITEMS[idx].title || '';
    $('fArtist').value = ITEMS[idx].artist || '';
    const imgs = ITEMS[idx].imgs && ITEMS[idx].imgs.length ? ITEMS[idx].imgs : [ITEMS[idx].img || ''];
    $('fImgs').value = imgs.join('\n');
    $('fDesc').value = ITEMS[idx].desc || '';
  } else {
    $('sheetTitle').textContent = '添加一段内容';
    $('fTitle').value = ''; $('fArtist').value = ''; $('fImgs').value = ''; $('fDesc').value = '';
  }
  sheet.classList.add('show'); mask.classList.add('show');
}
function closeSheet(){ sheet.classList.remove('show'); mask.classList.remove('show'); editingIdx = -1; }
$('openSheet').addEventListener('click', () => openSheet(-1));
$('cancelAdd').addEventListener('click', closeSheet);
mask.addEventListener('click', () => {
  sheet.classList.remove('show');
  $('inviteSheet').classList.remove('show');
});
$('confirmAdd').addEventListener('click', () => {
  const imgs = $('fImgs').value.split('\n').map(s => s.trim()).filter(Boolean);
  const data = {
    title: $('fTitle').value.trim(),
    artist: $('fArtist').value.trim(),
    imgs: imgs,
    img: imgs[0] || '',
    desc: $('fDesc').value.trim()
  };
  if(!data.title){ alert('不萌则已 一萌惊人^ω^'); return; }
  if(editingIdx >= 0) ITEMS[editingIdx] = data;
  else ITEMS.push(data);
  save(); renderList(); closeSheet();
  if(editingIdx >= 0) selectItem(editingIdx);
  else selectItem(ITEMS.length - 1);
});

nextBtn.addEventListener('click', (e) => { rippleAt(nextBtn, e); if(ITEMS.length) selectItem((current+1)%ITEMS.length); });
cover.addEventListener('click', (e) => { rippleAt(cover, e); if(ITEMS.length) selectItem((current+1)%ITEMS.length); });
eclipse.addEventListener('click', () => eclipse.classList.toggle('paused'));

document.addEventListener('keydown', (e) => {
  if(!ITEMS.length) return;
  if(e.key === 'ArrowRight') selectItem((current+1)%ITEMS.length);
  if(e.key === 'ArrowLeft')  selectItem((current-1+ITEMS.length)%ITEMS.length);
});

/* ===== 邀请函文字可编辑 ===== */
const INVITE_KEY = 'my_invite_text_v1';
const DEFAULT_INVITE = {
  title: '想要进入<br>我的世界吗',
  sub: '𓈒𓏸˚₊雪 が 交互 に 降る 瞬間𓇬₊˚',
  btn1: '. ⊹ ℭ𝔬𝔩𝔡 𝔚𝔦𝔫𝔱𝔢𝔯 𝔅𝔢𝔩𝔩❅ ִ֗',
  btn2: '⊹․⁺ ✮ぼんやりした破片⨳. ˖'
};
function loadInvite(){
  let cfg = DEFAULT_INVITE;
  try{
    const raw = localStorage.getItem(INVITE_KEY);
    if(raw) cfg = Object.assign({}, DEFAULT_INVITE, JSON.parse(raw));
  }catch(e){}
  $('inviteTitle').innerHTML = cfg.title;
  $('inviteSub').innerHTML = cfg.sub;
  $('btnWant').textContent = cfg.btn1;
  $('btnVery').textContent = cfg.btn2;
  return cfg;
}
let inviteCfg = loadInvite();

$('inviteEdit').addEventListener('click', (e) => {
  e.stopPropagation();
  $('ivTitle').value = inviteCfg.title;
  $('ivSub').value = inviteCfg.sub;
  $('ivBtn1').value = inviteCfg.btn1;
  $('ivBtn2').value = inviteCfg.btn2;
  $('inviteSheet').classList.add('show');
  mask.classList.add('show');
});
$('inviteCancel').addEventListener('click', () => $('inviteSheet').classList.remove('show'));
$('inviteSave').addEventListener('click', () => {
  inviteCfg = {
    title: $('ivTitle').value.trim() || DEFAULT_INVITE.title,
    sub: $('ivSub').value.trim() || DEFAULT_INVITE.sub,
    btn1: $('ivBtn1').value.trim() || DEFAULT_INVITE.btn1,
    btn2: $('ivBtn2').value.trim() || DEFAULT_INVITE.btn2
  };
  localStorage.setItem(INVITE_KEY, JSON.stringify(inviteCfg));
  $('inviteTitle').innerHTML = inviteCfg.title;
  $('inviteSub').innerHTML = inviteCfg.sub;
  $('btnWant').textContent = inviteCfg.btn1;
  $('btnVery').textContent = inviteCfg.btn2;
  $('inviteSheet').classList.remove('show');
  mask.classList.remove('show');
});

/* ===== 大邮票中间撕开 ===== */
const STAMP_KEY = 'my_stamp_text_v1';
const DEFAULT_STAMP_TXT = '长按邮票可撕开';
(function(){
  const stamp = document.getElementById('bigStamp');
  const track = document.getElementById('welcomeTrack');
  let pressTimer = null, holdTimer = null, torn = false;

  /* 读邮票文字 */
  let stampTxt = DEFAULT_STAMP_TXT;
  try{
    const saved = localStorage.getItem(STAMP_KEY);
    if(saved) stampTxt = saved;
  }catch(e){}
  document.querySelector('.stamp-half.right .stamp-txt').textContent = stampTxt;

  /* *⊹꙳𝒮𝓃ℴ𝓌 𝒞ℴ𝓊𝓃𝓉𝓇𝓎 𝒯𝓇𝒶𝓋ℯ𝓁 ໒꒱ ˖ .˚ */
  document.querySelector('.stamp-half.right .stamp-txt').addEventListener('click', (e) => {
    e.stopPropagation();
    const t = prompt('邮票上写什么：', stampTxt);
    if(t !== null){
      stampTxt = t.trim() || DEFAULT_STAMP_TXT;
      document.querySelector('.stamp-half.right .stamp-txt').textContent = stampTxt;
      localStorage.setItem(STAMP_KEY, stampTxt);
    }
  });

  function spawnTearSnow(){
    for(let i = 0; i < 20; i++){
      const s = document.createElement('span');
      s.className = 'tear-snow';
      const dx = (Math.random()-.5)*200;
      const dy = 40 + Math.random()*120;
      s.style.setProperty('--dx', dx + 'px');
      s.style.setProperty('--dy', dy + 'px');
      s.style.left = (50 + (Math.random()-.5)*20) + '%';
      s.style.top = (30 + Math.random()*40) + '%';
      s.style.width = s.style.height = (3 + Math.random()*5) + 'px';
      stamp.appendChild(s);
      setTimeout(() => s.remove(), 1600);
    }
  }

  function startPress(e){
    if(torn) return;
    e.preventDefault();
    pressTimer = setTimeout(() => stamp.classList.add('holding'), 200);
    holdTimer = setTimeout(() => {
      torn = true;
      stamp.classList.remove('holding');
      stamp.classList.add('torn');
      spawnTearSnow();
      /* 撕开后显示进入按钮，不自动跳转 */
      setTimeout(() => document.getElementById('enterInvite').classList.add('show'), 800);
    }, 1500);
  }
  function endPress(){
    clearTimeout(pressTimer);
    clearTimeout(holdTimer);
    if(!torn) stamp.classList.remove('holding');
  }
  stamp.addEventListener('mousedown', startPress);
  stamp.addEventListener('touchstart', startPress, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => stamp.addEventListener(ev, endPress));

  document.getElementById('enterInvite').addEventListener('click', () => {
    track.classList.add('slide-in');
  });

  /* 雪花泡泡点击爆开 */
  const bubble = document.getElementById('stampBubble');
  let bursting = false;
  bubble.addEventListener('click', (e) => {
    e.stopPropagation();
    if(bursting) return;
    bursting = true;
    bubble.classList.remove('regrow');
    bubble.classList.add('burst');
    setTimeout(() => {
      bubble.classList.remove('burst');
      bubble.classList.add('regrow');
      setTimeout(() => { bubble.classList.remove('regrow'); bursting = false; }, 800);
    }, 600);
  });


  /* 全屏雪地雪花 */
  const snowFull = document.getElementById('snowFull');
  for(let i = 0; i < 60; i++){
    const s = document.createElement('span');
    const size = 2 + Math.random()*7;
    s.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${5+Math.random()*10}s;animation-delay:${Math.random()*10}s;opacity:${.4+Math.random()*.5};`;
    snowFull.appendChild(s);
  }

  /* 渐变雪花 */
  const layer = document.getElementById('snowLayer');
  const colors = ['#ffffff','#c8d4e6','#a8b8d4','#8aa0c0','#d4c8e8'];
  for(let i = 0; i < 24; i++){
    const s = document.createElement('span');
    const size = 2 + Math.random()*5;
    s.style.cssText = `position:absolute;top:-10px;left:${Math.random()*100}%;width:${size}px;height:${size}px;border-radius:50%;background:${colors[i%colors.length]};opacity:.6;animation:snowFall ${6+Math.random()*8}s linear ${Math.random()*8}s infinite;box-shadow:0 0 ${size}px ${colors[i%colors.length]};`;
    layer.appendChild(s);
  }
})();

function enterWorld(){
  const w = document.getElementById('welcome');
  w.classList.add('leaving');
  document.body.style.overflow = '';

}
document.getElementById('btnWant').addEventListener('click', function(){

  setTimeout(enterWorld, 700);
});
document.getElementById('btnVery').addEventListener('click', enterWorld);

load();
renderList();
document.querySelectorAll('.reveal').forEach(el => observeReveal(el));
if(ITEMS.length) selectItem(0);
else resetView();
